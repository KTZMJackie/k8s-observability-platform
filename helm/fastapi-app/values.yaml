replicaCount: 1

image:
  repository: fastapi-app
  tag: latest
  pullPolicy: Never

service:
  type: NodePort
  port: 80
  targetPort: 80
  nodePort: 30080

env:
  apiKey: ""  # Pass at deploy time: --set env.apiKey=$API_KEY

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"
